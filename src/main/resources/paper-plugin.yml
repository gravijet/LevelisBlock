name: LevelBlock
version: '${version}'
main: net.gravijet.levelblock.Main
api-version: '26.2'
description: 'XP-based block and border challenges for Paper.'
author: GraviJet
website: 'https://github.com/GraviJet/LevelBlock'

permissions:
  levelblock.play:
    description: 'Darf Bloecke freischalten, indem man gegen die Grenze laeuft.'
    default: true
  levelblock.admin:
    description: 'Access to /timer, /lb and /reset.'
    default: op
  levelblock.bypass:
    description: 'Bypass the border with /lb bypass.'
    default: op
