  # /blocks. Platzhalter: %blocks% %cost% %levels%
  blocks-info: "<white>%blocks%</white> <gray>Bloecke freigeschaltet. Der naechste kostet</gray> <white>%cost% Level</white><gray>, du hast</gray> <white>%levels%</white><gray>.</gray>"
  # /border. Platzhalter: %size% %per% %next% %levels%
  border-info: "<gray>Aktuell</gray> <white>%size% x %size%</white><gray>. Jedes Level gibt</gray> <white>+%per%</white><gray>, als naechstes also</gray> <white>%next% x %next%</white><gray>.</gray>"
